# 平台配置 - 支持微信、知乎、简书、Bilibili 专栏、少数派和通用网页

platforms:
  wechat:
    name: "微信公众号"
    article_patterns:
      - 'mp\.weixin\.qq\.com/s/'
    list_patterns:
      - 'mp\.weixin\.qq\.com/mp/profile_ext'
    article_selector: "#js_content"
    title_selector: "#activity-name"
    author_selector: "#js_name"
    date_selector: "#publish_time"
    list_link_selector: "a[href*='/s/']"
    needs_scroll: true
    wait_selector: "#js_content"
    tail_noise_markers:
      - "今日好文推荐"
      - "好文推荐"
      - "相关推荐"
      - "猜你喜欢"
      - "为你推荐"
      - "热门推荐"
      - "会议推荐"
      - "活动推荐"
      - "课程推荐"
      - "广告"
      - "推广"
      - "赞助"
      - "商务合作"
      - "扫码关注"
      - "长按关注"
      - "关注公众号"
      - "阅读原文"
      - "点击阅读原文"
      - "查看原文"
      - "转载请联系"
    noise_html_patterns:
      - '<div[^>]*class="[^"]*qr-code[^"]*"[^>]*>.*?</div>'
      - '<div[^>]*class="[^"]*recommend[^"]*"[^>]*>.*?</div>'
      - '<div[^>]*class="[^"]*ad[^"]*"[^>]*>.*?</div>'
      - '<div[^>]*id="[^"]*ad[^"]*"[^>]*>.*?</div>'
      - '<section[^>]*class="[^"]*mp_profile_popup[^"]*"[^>]*>.*?</section>'
      - '<section[^>]*class="[^"]*js_ad[^"]*"[^>]*>.*?</section>'
      - '<a[^>]*class="[^"]*appmsg_card[^"]*"[^>]*>.*?</a>'
    keep_query_params:
      - "wx_fmt"
      - "tp"
    wait_until: "networkidle"

  zhihu:
    name: "知乎"
    article_patterns:
      - 'zhuanlan\.zhihu\.com/p/'
      - 'zhihu\.com/question/\d+/answer/\d+'
    list_patterns:
      - 'zhuanlan\.zhihu\.com/p/\?page='
      - 'zhihu\.com/people/.*/posts'
      - 'zhihu\.com/question/\d+/?(?:[?#]|$)'
    article_selector: ".Post-RichText, .RichText, .RichContent-inner"
    title_selector: "h1.QuestionHeader-title, .Post-Title, .ContentItem-title, h1.Post-Title"
    author_selector: ".AuthorInfo-name, .UserLink-author"
    date_selector: ".ContentItem-time, .Post-Time"
    list_link_selector: "a[href*='/p/'], a[href*='/answer/']"
    needs_scroll: false
    wait_selector: ".Post-RichText, .RichText"
    tail_noise_markers:
      - "相关推荐"
      - "猜你喜欢"
      - "为你推荐"
      - "热门推荐"
      - "广告"
      - "推广"
      - "赞助"
      - "商务合作"
      - "扫码关注"
      - "长按关注"
      - "阅读原文"
      - "点击阅读原文"
      - "转载请联系"
    noise_html_patterns: []
    keep_query_params: []
    wait_until: "networkidle"

  jianshu:
    name: "简书"
    article_patterns:
      - 'jianshu\.com/p/'
    list_patterns:
      - 'jianshu\.com/u/'
    article_selector: "article, .article, ._2gDJMmCVA5UvC-cfDwZzJw"
    title_selector: "h1, .title, ._2zeTMsM5q05HTvYg3D5KVC"
    author_selector: ".author .name, .nickname, ._23I9m-aPK-9hXkE8bPTh7V"
    date_selector: ".publish-time, .time, [data-testid='public-time']"
    list_link_selector: "a[href*='/p/']"
    needs_scroll: true
    wait_selector: "article, .article"
    tail_noise_markers:
      - "相关推荐"
      - "猜你喜欢"
      - "为你推荐"
      - "热门推荐"
      - "广告"
      - "推广"
      - "赞助"
      - "扫码关注"
      - "长按关注"
      - "阅读原文"
      - "点击阅读原文"
      - "转载请联系"
    noise_html_patterns: []
    keep_query_params: []
    wait_until: "domcontentloaded"

  bilibili:
    name: "Bilibili专栏"
    article_patterns:
      - 'bilibili\.com/read/cv'
    list_patterns:
      - 'space\.bilibili\.com/.*/article'
    article_selector: ".article-content, .read-article-box, #read-article-holder"
    title_selector: "h1.title, .article-title, h1"
    author_selector: ".author-name, .up-name, .name"
    date_selector: ".publish-time, .time, .pubdate"
    list_link_selector: "a[href*='/read/cv']"
    needs_scroll: true
    wait_selector: ".article-content"
    tail_noise_markers:
      - "相关推荐"
      - "猜你喜欢"
      - "为你推荐"
      - "热门推荐"
      - "广告"
      - "推广"
      - "赞助"
      - "扫码关注"
      - "长按关注"
      - "关注公众号"
      - "阅读原文"
      - "点击阅读原文"
      - "转载请联系"
    noise_html_patterns: []
    keep_query_params: []
    wait_until: "domcontentloaded"

  sspai:
    name: "少数派"
    article_patterns:
      - 'sspai\.com/post/'
    list_patterns:
      - 'sspai\.com/user/.*/posts'
      - 'sspai\.com/matrix'
    article_selector: ".wangEditor-txt, .article-body"
    title_selector: "h1.article__header__title, h1.article-title, h1"
    author_selector: ".ss__user__card__nickname__wrapper, .article__header__author"
    date_selector: ".article__header__date"
    list_link_selector: "a[href*='/post/']"
    needs_scroll: false
    wait_selector: ".wangEditor-txt, .article-body"
    tail_noise_markers:
      - "相关推荐"
      - "猜你喜欢"
      - "为你推荐"
      - "热门推荐"
      - "广告"
      - "推广"
      - "赞助"
      - "商务合作"
      - "扫码关注"
      - "长按关注"
      - "阅读原文"
      - "点击阅读原文"
      - "转载请联系"
    noise_html_patterns: []
    keep_query_params: []
    wait_until: "domcontentloaded"
    download_images: true

  generic:
    name: "通用网页"
    article_patterns: []
    list_patterns: []
    article_selector: "article, main, .content, .post, .entry"
    title_selector: "h1, .title, .post-title"
    author_selector: ".author, .byline"
    date_selector: ".date, .time, .published"
    list_link_selector: "a"
    needs_scroll: false
    tail_noise_markers:
      - "相关推荐"
      - "猜你喜欢"
      - "为你推荐"
      - "热门推荐"
      - "广告"
      - "推广"
      - "赞助"
      - "商务合作"
      - "扫码关注"
      - "长按关注"
      - "阅读原文"
      - "点击阅读原文"
      - "转载请联系"
    noise_html_patterns: []
    keep_query_params: []
    wait_until: "domcontentloaded"
